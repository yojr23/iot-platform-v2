services:
  # MySQL 8 with ROW-based binlog for Debezium CDC. The binlog expires after 7 days, bounding
  # the connector's outage-recovery window. DEBEZIUM_DB_PASSWORD is consumed by the init script
  # that creates the CDC replication user — required, no default.
  db:
    image: mysql:8.0
    # Gate 10 (Task 3.1): explicit ROW-based binlog so Debezium can capture the outbox tables.
    # 7-day retention bounds the connector's outage-recovery window.
    command:
      - --server-id=184054
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --binlog-expire-logs-seconds=604800
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-iot_platform}
      MYSQL_USER: ${DB_USERNAME:-iot_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-iot_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      # Consumed by infra/mysql/init/01-create-cdc-user.sh (Task 3.2). Required, no default.
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?DEBEZIUM_DB_PASSWORD is required}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - iot-platform

  redis:
    image: redis:7-alpine
    # AOF acknowledges append work at most one second before fsync. The named volume preserves
    # Redis data across container replacement; this is an approximately one-second Redis-side RPO,
    # not a substitute for replication or backups.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - iot-platform

  back:
    build:
      context: ./back
      dockerfile: Dockerfile
    working_dir: /var/www/back
    environment:
      APP_URL: http://localhost:${BACK_PORT:-8000}
      FRONT_URL: http://localhost:${FRONT_PORT:-5173}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-iot_platform}
      DB_USERNAME: ${DB_USERNAME:-iot_user}
      DB_PASSWORD: ${DB_PASSWORD:-iot_password}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      INGESTION_SERVICE_TOKEN: ${INGESTION_SERVICE_TOKEN:-}
      INGESTION_RAW_EVENTS_STREAM: ${INGESTION_RAW_EVENTS_STREAM:-iot.raw-events}
      INGESTION_RAW_EVENTS_MAXLEN: ${INGESTION_RAW_EVENTS_MAXLEN:-500000}
      INGESTION_RAW_EVENTS_MIN_AGE_MS: ${INGESTION_RAW_EVENTS_MIN_AGE_MS:-0}
      DOMAIN_EVENTS_STREAM: ${DOMAIN_EVENTS_STREAM:-iot.domain-events}
      DOMAIN_EVENTS_MAXLEN: ${DOMAIN_EVENTS_MAXLEN:-500000}
      DOMAIN_EVENTS_MIN_AGE_MS: ${DOMAIN_EVENTS_MIN_AGE_MS:-0}
      INGESTION_DEAD_LETTER_STREAM: ${INGESTION_DEAD_LETTER_STREAM:-iot.dead-letter-events}
      DLQ_MAXLEN: ${DLQ_MAXLEN:-1000000}
      CDC_RAW_OUTBOX_STREAM: ${CDC_RAW_OUTBOX_STREAM:-iot-cdc.iot_platform.raw_event_outboxes}
      CDC_DOMAIN_OUTBOX_STREAM: ${CDC_DOMAIN_OUTBOX_STREAM:-iot-cdc.iot_platform.domain_event_outboxes}
      CDC_STREAM_MAXLEN: ${CDC_STREAM_MAXLEN:-500000}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONT_PORT:-5173},http://127.0.0.1:${FRONT_PORT:-5173}
      SANCTUM_STATEFUL_DOMAINS: localhost:${FRONT_PORT:-5173},127.0.0.1:${FRONT_PORT:-5173},localhost:${BACK_PORT:-8000},127.0.0.1:${BACK_PORT:-8000}
      # Broadcast domain events to the self-hosted Reverb WebSocket server (not BROADCAST=log).
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      REVERB_APP_ID: ${REVERB_APP_ID:-iotlocal}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-iotlocalkey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-iotlocalsecret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    ports:
      - "${BACK_PORT:-8000}:8000"
    volumes:
      - ./back:/var/www/back
      - back_vendor:/var/www/back/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - iot-platform

  # Self-hosted Pusher-protocol WebSocket server. Browser connects at 127.0.0.1:8080; the backend
  # and domain-event consumer publish broadcasts to it via host `reverb` on the compose network.
  reverb:
    build:
      context: ./back
      dockerfile: Dockerfile
    working_dir: /var/www/back
    environment:
      APP_URL: http://localhost:${BACK_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-iot_platform}
      DB_USERNAME: ${DB_USERNAME:-iot_user}
      DB_PASSWORD: ${DB_PASSWORD:-iot_password}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-iotlocal}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-iotlocalkey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-iotlocalsecret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    restart: unless-stopped
    ports:
      - "${REVERB_PORT:-8080}:8080"
    volumes:
      - ./back:/var/www/back
      - back_vendor:/var/www/back/vendor
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1',8080)?0:1);\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - iot-platform

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      VITE_API_BASE_URL: http://localhost:${BACK_PORT:-8000}/api
      VITE_API_PROXY_TARGET: http://back:8000
      # Browser realtime → Reverb (Pusher protocol). Key mirrors REVERB_APP_KEY; host/port are the
      # browser-reachable published address (127.0.0.1:8080), NOT the compose-internal `reverb` host.
      VITE_PUSHER_APP_KEY: ${VITE_PUSHER_APP_KEY:-${REVERB_APP_KEY:-iotlocalkey}}
      VITE_PUSHER_APP_CLUSTER: ${VITE_PUSHER_APP_CLUSTER:-}
      VITE_PUSHER_FORCE_TLS: ${VITE_PUSHER_FORCE_TLS:-false}
      VITE_PUSHER_HOST: ${VITE_PUSHER_HOST:-127.0.0.1}
      VITE_PUSHER_PORT: ${VITE_PUSHER_PORT:-8080}
      VITE_PUSHER_SCHEME: ${VITE_PUSHER_SCHEME:-http}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONT_PORT:-5173}:5173"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    depends_on:
      back:
        condition: service_healthy
    networks:
      - iot-platform

  queue:
    build:
      context: ./back
      dockerfile: Dockerfile
    working_dir: /var/www/back
    environment:
      APP_URL: http://localhost:${BACK_PORT:-8000}
      FRONT_URL: http://localhost:${FRONT_PORT:-5173}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-iot_platform}
      DB_USERNAME: ${DB_USERNAME:-iot_user}
      DB_PASSWORD: ${DB_PASSWORD:-iot_password}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: ${CACHE_STORE:-database}
      SESSION_DRIVER: ${SESSION_DRIVER:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      INGESTION_SERVICE_TOKEN: ${INGESTION_SERVICE_TOKEN:-}
      INGESTION_RAW_EVENTS_STREAM: ${INGESTION_RAW_EVENTS_STREAM:-iot.raw-events}
      INGESTION_RAW_EVENTS_MAXLEN: ${INGESTION_RAW_EVENTS_MAXLEN:-500000}
      INGESTION_RAW_EVENTS_MIN_AGE_MS: ${INGESTION_RAW_EVENTS_MIN_AGE_MS:-0}
      DOMAIN_EVENTS_STREAM: ${DOMAIN_EVENTS_STREAM:-iot.domain-events}
      DOMAIN_EVENTS_MAXLEN: ${DOMAIN_EVENTS_MAXLEN:-500000}
      DOMAIN_EVENTS_MIN_AGE_MS: ${DOMAIN_EVENTS_MIN_AGE_MS:-0}
      INGESTION_DEAD_LETTER_STREAM: ${INGESTION_DEAD_LETTER_STREAM:-iot.dead-letter-events}
      DLQ_MAXLEN: ${DLQ_MAXLEN:-1000000}
      CDC_RAW_OUTBOX_STREAM: ${CDC_RAW_OUTBOX_STREAM:-iot-cdc.iot_platform.raw_event_outboxes}
      CDC_DOMAIN_OUTBOX_STREAM: ${CDC_DOMAIN_OUTBOX_STREAM:-iot-cdc.iot_platform.domain_event_outboxes}
      CDC_STREAM_MAXLEN: ${CDC_STREAM_MAXLEN:-500000}
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    restart: unless-stopped
    volumes:
      - ./back:/var/www/back
      - back_vendor:/var/www/back/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      back:
        condition: service_healthy
    profiles:
      - queue
    networks:
      - iot-platform

  # Durable ingestion workers + Gate 10 CDC pipeline (PLAN.md Stage 3/4/10, ADR-G1). All reuse the
  # back image and the same phpredis/DB env. Run under the `workers` profile:
  # `docker compose --profile workers up`. The periodic outbox relays (outbox-relay,
  # domain-outbox-relay) were retired at Gate 10 — publication is now binlog-driven (debezium +
  # outbox-cdc-consumer), no `--interval` sweep remains.
  raw-consumer:
    build:
      context: ./back
      dockerfile: Dockerfile
    working_dir: /var/www/back
    environment: &worker_env
      APP_URL: http://localhost:${BACK_PORT:-8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-iot_platform}
      DB_USERNAME: ${DB_USERNAME:-iot_user}
      DB_PASSWORD: ${DB_PASSWORD:-iot_password}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: ${CACHE_STORE:-database}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
      INGESTION_RAW_EVENTS_STREAM: ${INGESTION_RAW_EVENTS_STREAM:-iot.raw-events}
      INGESTION_RAW_EVENTS_MAXLEN: ${INGESTION_RAW_EVENTS_MAXLEN:-500000}
      INGESTION_RAW_CONSUMER_GROUP: ${INGESTION_RAW_CONSUMER_GROUP:-raw-process-v1}
      INGESTION_DEAD_LETTER_STREAM: ${INGESTION_DEAD_LETTER_STREAM:-iot.dead-letter-events}
      DLQ_MAXLEN: ${DLQ_MAXLEN:-1000000}
      DOMAIN_EVENTS_STREAM: ${DOMAIN_EVENTS_STREAM:-iot.domain-events}
      DOMAIN_EVENTS_MAXLEN: ${DOMAIN_EVENTS_MAXLEN:-500000}
      DOMAIN_EVENTS_CONSUMER_GROUP: ${DOMAIN_EVENTS_CONSUMER_GROUP:-browser-delivery-v1}
      CDC_RAW_OUTBOX_STREAM: ${CDC_RAW_OUTBOX_STREAM:-iot-cdc.iot_platform.raw_event_outboxes}
      CDC_DOMAIN_OUTBOX_STREAM: ${CDC_DOMAIN_OUTBOX_STREAM:-iot-cdc.iot_platform.domain_event_outboxes}
      CDC_STREAM_MAXLEN: ${CDC_STREAM_MAXLEN:-500000}
      CDC_OUTBOX_CONSUMER_GROUP: ${CDC_OUTBOX_CONSUMER_GROUP:-outbox-publish-v1}
      # domain-event-consumer broadcasts to Reverb — must target the reverb service, not BROADCAST=log.
      BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
      REVERB_APP_ID: ${REVERB_APP_ID:-iotlocal}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-iotlocalkey}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-iotlocalsecret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
    command: php artisan raw:consume --block=5000
    restart: unless-stopped
    volumes:
      - ./back:/var/www/back
      - back_vendor:/var/www/back/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      back:
        condition: service_healthy
    profiles:
      - workers
    networks:
      - iot-platform

  # Gate 10: MySQL binlog -> Redis CDC streams. Debezium never writes to iot.raw-events /
  # iot.domain-events directly (those carry app-defined envelopes); it writes iot-cdc.<db>.<table>,
  # which outbox-cdc-consumer republishes through the existing publishers.
  debezium:
    image: quay.io/debezium/server:3.5
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-iot_platform}
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER:-debezium}
      DEBEZIUM_DB_PASSWORD: ${DEBEZIUM_DB_PASSWORD:?DEBEZIUM_DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - ./cdc/application.properties:/debezium/config/application.properties:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - workers
    networks:
      - iot-platform

  # Gate 10: the single final publication owner. Drains the CDC streams with a blocking
  # XREADGROUP + XAUTOCLAIM lease recovery — no periodic DB discovery, no interval sweep.
  outbox-cdc-consumer:
    build:
      context: ./back
      dockerfile: Dockerfile
    working_dir: /var/www/back
    environment: *worker_env
    command: php artisan cdc:consume-outboxes --block=5000
    restart: unless-stopped
    volumes:
      - ./back:/var/www/back
      - back_vendor:/var/www/back/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      debezium:
        condition: service_started
    profiles:
      - workers
    networks:
      - iot-platform

  domain-event-consumer:
    build:
      context: ./back
      dockerfile: Dockerfile
    working_dir: /var/www/back
    environment: *worker_env
    command: php artisan domain:consume --block=5000
    restart: unless-stopped
    volumes:
      - ./back:/var/www/back
      - back_vendor:/var/www/back/vendor
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      back:
        condition: service_healthy
      reverb:
        condition: service_healthy
    profiles:
      - workers
    networks:
      - iot-platform

  # Python MQTT ingestion service (spool + delivery worker)
  ingestion:
    build:
      context: ./ingestion_service
      dockerfile: Dockerfile
    environment:
      # The MQTT broker is intentionally external to this Compose topology; fail configuration
      # resolution early instead of starting a restart loop against a nonexistent host.
      MQTT_HOST: ${MQTT_HOST:?MQTT_HOST is required because no MQTT broker service is defined}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TOPIC: ${MQTT_TOPIC:-iot/+/readings}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-iot-platform-v2-ingestion}
      MQTT_QOS: ${MQTT_QOS:-1}
      MQTT_CLEAN_SESSION: ${MQTT_CLEAN_SESSION:-false}
      BACKEND_BASE_URL: http://back:8000
      BACKEND_INGESTION_TOKEN: ${INGESTION_SERVICE_TOKEN:?INGESTION_SERVICE_TOKEN is required}
      BACKEND_TIMEOUT_SECONDS: ${BACKEND_TIMEOUT_SECONDS:-10}
      INGESTION_MODE: mqtt
      INGESTION_SPOOL_PATH: /app/spool/ingestion-spool.sqlite3
      INGESTION_RETRY_BASE_SECONDS: ${INGESTION_RETRY_BASE_SECONDS:-2}
      INGESTION_RETRY_MAX_SECONDS: ${INGESTION_RETRY_MAX_SECONDS:-60}
      INGESTION_DELIVERY_BATCH_SIZE: ${INGESTION_DELIVERY_BATCH_SIZE:-50}
      INGESTION_MAX_DELIVERY_ATTEMPTS: ${INGESTION_MAX_DELIVERY_ATTEMPTS:-20}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    restart: unless-stopped
    volumes:
      - ingestion_spool:/app/spool
    depends_on:
      back:
        condition: service_healthy
    profiles:
      - workers
    networks:
      - iot-platform

volumes:
  db_data:
  redis_data:
  back_vendor:
  front_node_modules:
  ingestion_spool:

networks:
  iot-platform:
    driver: bridge
