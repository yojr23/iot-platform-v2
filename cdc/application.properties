# Gate 10 (PLAN.md Task 4.1) — Debezium Server: MySQL binlog -> Redis CDC streams.
#
# Debezium writes change events onto Redis streams named `iot-cdc.<db>.<table>` (topic.prefix +
# schema + table). It deliberately does NOT write to iot.raw-events / iot.domain-events — those
# carry application-defined envelopes that existing consumers depend on. The application consumer
# (`cdc:consume-outboxes`) is the sole bridge from CDC streams to the app streams.

# --- Sink: Redis Streams ---
debezium.sink.type=redis
debezium.sink.redis.address=${REDIS_HOST:redis}:${REDIS_PORT:6379}
debezium.sink.redis.message.format=extended

# --- Source: MySQL connector ---
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.database.hostname=${DB_HOST:db}
debezium.source.database.port=${DB_PORT:3306}
debezium.source.database.user=${DEBEZIUM_DB_USER:debezium}
debezium.source.database.password=${DEBEZIUM_DB_PASSWORD}
# Distinct from the mysqld --server-id (184054) so the connector registers as a separate replica.
debezium.source.database.server.id=184055
debezium.source.database.include.list=${DB_DATABASE:iot_platform}
debezium.source.table.include.list=${DB_DATABASE:iot_platform}.raw_event_outboxes,${DB_DATABASE:iot_platform}.domain_event_outboxes
debezium.source.topic.prefix=iot-cdc
debezium.source.snapshot.mode=initial

# --- Durable offset + schema history in Redis (survive connector restart) ---
debezium.source.offset.storage=io.debezium.storage.redis.offset.RedisOffsetBackingStore
debezium.source.offset.storage.redis.address=${REDIS_HOST:redis}:${REDIS_PORT:6379}
debezium.source.schema.history.internal=io.debezium.storage.redis.history.RedisSchemaHistory
debezium.source.schema.history.internal.redis.address=${REDIS_HOST:redis}:${REDIS_PORT:6379}

# --- Envelope format ---
debezium.format.key=json
debezium.format.value=json
debezium.format.value.schemas.enable=false
