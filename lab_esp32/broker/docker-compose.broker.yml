# Broker MQTT independiente del stack principal.
# Se corre en la máquina que haga de broker en el lab (no es la de este repo).
#
#   ./make-users.sh lab_postgrado_nodo_01 ingestion   (crea usuarios; imprime claves una vez)
#   docker compose -f docker-compose.broker.yml up -d
#
# Expone 1883 (MQTT).
services:
  broker:
    image: eclipse-mosquitto:2
    container_name: lab-mosquitto
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - "${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      # Directorio completo: mosquitto.conf, acl y passwd (passwd lo crea make-users.sh, fuera de git).
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mosquitto_data:
  mosquitto_log:
