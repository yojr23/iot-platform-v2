# Mosquitto - broker MQTT para el laboratorio.
# Config mínima para que el ESP32 publique y el ingestion_service se suscriba.
#
# MODO ACTUAL: anónimo permitido (rápido para probar en el lab mañana).
# Para producción: pon allow_anonymous false y define un password_file.

listener 1883 0.0.0.0
allow_anonymous true

# Persistencia de sesiones QoS-1 (el ingestion_service usa clean_session=false,
# así el broker encola mensajes mientras el suscriptor esté caído).
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type all

# --- Autenticación (descomentar cuando se quiera cerrar) ---
# allow_anonymous false
# password_file /mosquitto/config/passwd
#   Crear usuario:  docker compose exec broker mosquitto_passwd -c /mosquitto/config/passwd iot
