# Mosquitto - broker MQTT para el laboratorio.
# Autenticado: usuarios en passwd (make-users.sh) y permisos en acl.
# TLS fuera de alcance hoy (1883 plano en la LAN); siguiente paso: listener 8883 con certificados.

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Persistencia de sesiones QoS-1 (el ingestion_service usa clean_session=false,
# así el broker encola mensajes mientras el suscriptor esté caído).
# Sin tope de cola: la acota el disco, no un límite de 1000 mensajes.
max_queued_messages 0
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

log_dest stdout
log_type error
log_type warning
log_type notice
